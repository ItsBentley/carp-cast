<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carp Cast</title>
<style>
:root{--bg:#e3ece8;--ink:#11312c;--mute:#5b7670;--card:#f4f8f6;--line:#c3d3cd;--acc:#d8362b;--ok:#2f7d5b;--mid:#b98a1d}
@media (prefers-color-scheme:dark){:root{--bg:#0d2326;--ink:#e2eeea;--mute:#8fabA5;--card:#143034;--line:#25474b;--acc:#ff6a55;--ok:#5fc197;--mid:#e0b24a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:1.1rem;font-weight:600;margin:0 0 12px;color:var(--mute)}
form{display:flex;gap:8px;margin-bottom:8px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;color:var(--ink);background:var(--card)}
input{flex:1;min-width:0}
button{cursor:pointer;font-weight:600}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;margin-bottom:14px}
.tools button{flex:1;font-size:.9rem}
#place{font-weight:800;font-size:1.2rem;margin:4px 0 2px}
#msg{color:var(--mute);font-size:.85rem;margin:0 0 12px;min-height:1.2em}
.best{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;margin-bottom:16px}
.best .big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.best p{margin:4px 0 0;opacity:.85}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.row.top{border-color:var(--ok);border-width:2px}
.day{font-weight:800;font-size:1.05rem}
.cond{color:var(--mute);font-size:.9rem;grid-column:1}
.sc{grid-row:1/4;grid-column:2;text-align:right;font-weight:800;font-size:1.8rem;line-height:1}
.sc small{display:block;font-size:.75rem;font-weight:600;margin-top:3px}
.bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.note{color:var(--mute);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Carp Cast</h1>
<form id="f"><input id="q" placeholder="Postcode or town" autocomplete="off" aria-label="Postcode or town"><button class="go" type="submit">Search</button></form>
<div class="tools"><button type="button" id="gps">Use my location</button><button type="button" id="ref">Refresh</button></div>
<div id="place"></div>
<p id="msg"></p>
<div class="best" id="best" hidden></div>
<div id="list"></div>
<p class="note">Live forecast from Open-Meteo. Pressure is sea-level mb, shown from 6am to 9pm each day. The score weighs pressure trend most, then wind, sky, temperature and moon phase, with a small penalty for very high or very low pressure.</p>
</main>
<script>
var DEF={name:"Stollies Lake, Theydon Mount",lat:51.6749,lon:0.1527};
var loc=DEF;
try{var s=JSON.parse(localStorage.getItem("fwloc")||"null");if(s&&s.lat)loc=s;}catch(e){}
function $(i){return document.getElementById(i);}
function msg(t){$("msg").textContent=t;}
function mean(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}

async function geocode(q){
 var pc=q.toUpperCase().replace(/\s+/g,"");
 if(/^[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2}$/.test(pc)){
  var j=await (await fetch("https://api.postcodes.io/postcodes/"+pc)).json();
  if(j.status!==200)throw new Error("Postcode not found");
  return {name:q.toUpperCase()+" ("+(j.result.admin_ward||j.result.admin_district)+")",lat:j.result.latitude,lon:j.result.longitude};
 }
 if(/^[A-Z]{1,2}\d[A-Z\d]?$/.test(pc)){
  var o=await (await fetch("https://api.postcodes.io/outcodes/"+pc)).json();
  if(o.status!==200)throw new Error("Postcode area not found");
  return {name:pc+" area",lat:o.result.latitude,lon:o.result.longitude};
 }
 var g=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=en&countryCode=GB")).json();
 if(!g.results)throw new Error("Place not found");
 var p=g.results[0];
 return {name:p.name+(p.admin1?", "+p.admin1:""),lat:p.latitude,lon:p.longitude};
}

function moon(ds){
 var syn=29.530588853,ref=Date.UTC(2000,0,6,18,14),t=new Date(ds+"T12:00:00Z").getTime();
 var age=(((t-ref)/86400000)%syn+syn)%syn,d=Math.min(age,Math.abs(age-syn/2),syn-age);
 var names=["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];
 return {name:names[Math.round(age/syn*8)%8],pts:3+12*Math.max(0,1-d/7.4)};
}
function windPts(w){return w<=2?12:w<=10?20:w<=15?13:w<=20?7:2;}
function tempPts(t){return(t>=10&&t<=24)?15:((t>=4&&t<10)||(t>24&&t<=29))?10:4;}
function pressPts(r,avg){
 var v=r<=-1?10:r<=-0.5?22:r<=-0.1?40:r<0.15?30:r<0.5?20:6;
 if(avg>=1025||avg<=1000)v-=8;
 return Math.max(v,0);
}
function trendWord(r){return r<=-1?"falling fast":r<=-0.1?"falling":r<0.15?"steady":r<0.5?"rising slowly":"rising fast";}
function verdict(s){return s>=75?"Great":s>=55?"Good":s>=35?"Fair":"Slow";}
function colour(s){return s>=55?"var(--ok)":s>=35?"var(--mid)":"var(--acc)";}
function sky(rain,cloud){
 if(rain>=6)return["Wet",6];if(rain>=1.5)return["Rain",14];
 if(cloud<25)return["Clear",12];if(cloud<60)return["Partly cloudy",17];return["Cloudy",20];
}

async function load(){
 $("place").textContent=loc.name;msg("Loading forecast…");
 try{
  var u="https://api.open-meteo.com/v1/forecast?latitude="+loc.lat+"&longitude="+loc.lon+"&hourly=temperature_2m,pressure_msl,wind_speed_10m,cloud_cover,precipitation&wind_speed_unit=mph&timezone=Europe%2FLondon&forecast_days=7";
  var res=await fetch(u);if(!res.ok)throw new Error("Weather service error");
  var h=(await res.json()).hourly,days={};
  h.time.forEach(function(t,i){
   var d=t.slice(0,10);(days[d]=days[d]||[]).push({hr:+t.slice(11,13),t:h.temperature_2m[i],p:h.pressure_msl[i],w:h.wind_speed_10m[i],c:h.cloud_cover[i],r:h.precipitation[i]});
  });
  var out=Object.keys(days).map(function(d){
   var a=days[d],day=a.filter(function(x){return x.hr>=6&&x.hr<=20;});
   var first=a.filter(function(x){return x.hr===6;})[0]||a[0],last=a.filter(function(x){return x.hr===21;})[0]||a[a.length-1];
   var rain=day.reduce(function(s,x){return s+x.r;},0),cl=mean(day.map(function(x){return x.c;}));
   var sk=sky(rain,cl),m=moon(d),wind=Math.round(mean(day.map(function(x){return x.w;})));
   var hi=Math.round(Math.max.apply(null,a.map(function(x){return x.t;}))),lo=Math.round(Math.min.apply(null,a.map(function(x){return x.t;})));
   var p0=Math.round(first.p),p1=Math.round(last.p),r=(last.p-first.p)/Math.max(1,last.hr-first.hr);
   var base=windPts(wind)+sk[1]+tempPts((hi+lo)/2)+m.pts;
   return {lab:new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric"}),hi:hi,lo:lo,wind:wind,sky:sk[0],rain:rain,p0:p0,p1:p1,trend:trendWord(r),moon:m.name,
    score:Math.round(base*60/70+pressPts(r,(p0+p1)/2))};
  });
  var best=out.reduce(function(a,b){return b.score>a.score?b:a;});
  $("best").hidden=false;
  $("best").innerHTML='<div>Best day this week</div><div class="big">'+best.lab+'</div><p>'+verdict(best.score)+' ('+best.score+'/100) · pressure '+best.trend+' at '+best.p1+' mb, '+best.sky.toLowerCase()+', '+best.hi+'°C</p>';
  $("list").innerHTML=out.map(function(x){
   return '<div class="row'+(x===best?' top':'')+'"><div class="day">'+x.lab+'</div><div class="sc" style="color:'+colour(x.score)+'">'+x.score+'<small>'+verdict(x.score)+'</small></div>'+
   '<div class="cond">Pressure '+x.p0+' to '+x.p1+' mb, '+x.trend+'</div>'+
   '<div class="cond">'+x.sky+', '+x.hi+'° / '+x.lo+'°C</div>'+
   '<div class="cond">Wind ~'+x.wind+' mph · '+(x.rain>=0.2?'Rain '+x.rain.toFixed(1)+' mm':'Dry')+' · '+x.moon+'</div>'+
   '<div class="bar"><i style="width:'+x.score+'%;background:'+colour(x.score)+'"></i></div></div>';
  }).join("");
  msg("Updated "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
 }catch(e){msg("Couldn’t load the forecast: "+e.message+". Check your connection and try Refresh.");}
}
function setLoc(l){loc=l;try{localStorage.setItem("fwloc",JSON.stringify(l));}catch(e){}load();}

$("f").onsubmit=async function(e){
 e.preventDefault();var q=$("q").value.trim();if(!q)return;
 msg("Finding "+q+"…");
 try{setLoc(await geocode(q));$("q").value="";}catch(err){msg(err.message+". Try a full postcode or a nearby town.");}
};
$("ref").onclick=load;
$("gps").onclick=function(){
 if(!navigator.geolocation){msg("Location isn’t available on this device.");return;}
 msg("Getting your location…");
 navigator.geolocation.getCurrentPosition(function(p){setLoc({name:"My location",lat:p.coords.latitude,lon:p.coords.longitude});},function(){msg("Couldn’t get your location. Check location permission, or type a postcode.");},{timeout:10000});
};
load();
</script>
</body>
</html>
